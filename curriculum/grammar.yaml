# Grammar patterns, in learning order. Labels G1..G22 match the curriculum doc.
# example is a reference for Claude only; practice sentences are generated.

- id: g.to-be
  label: G1
  order: 1
  stage: 0
  name: '"I am, you are, it is"'
  needs: []
  how: >
    Spoken endings ـَم، ـی، ـه on a noun or adjective for "I am / you are / it is";
    هست for "there is / he is (somewhere)", نیست for "isn't".
  example: اسمم دکلنه.
  example_en: My name is Declan.

- id: g.possessive
  label: G2
  order: 2
  stage: 0
  name: '"My, your, his"'
  needs: [g.to-be]
  how: >
    Possessive endings on the noun: ـَم (my), ـِت (your), ـِش (his/her),
    ـِمون (our), ـِتون (your, plural/polite), ـِشون (their).
  example: کتابم کجاست؟
  example_en: Where's my book?

- id: g.questions
  label: G3
  order: 3
  stage: 0
  name: Question words
  needs: [g.to-be, g.possessive]
  how: >
    چی (what), کی (who), کجا (where), کِی (when), چند (how many / how much),
    چطور (how). In speech they usually come where the answer would go.
  example: اسمت چیه؟
  example_en: What's your name?

- id: g.have
  label: G4
  order: 4
  stage: 0
  name: '"I have" (داشتن, present)'
  needs: []
  how: >
    دارم، داری، داره، داریم، دارین، دارن ("have"), and ندارم… for
    "don't have". No می‌ in the present.
  example: یه داداش دارم.
  example_en: I have a brother.

- id: g.ezafe
  label: G5
  order: 5
  stage: 0
  name: Linking words with ـِ (اضافه)
  needs: [g.to-be]
  how: >
    An ـِ (after a vowel, ـیِ) links a noun to what describes or owns it:
    دوستِ من (my friend), خونه‌ی بزرگ (a big house).
  example: دوستِ منه.
  example_en: He's my friend.
